<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count On Us</title>
    <!-- Google Fonts: Plus Jakarta Sans for the exact modern geometric sans-serif look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Reset & Body Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: none; /* Hide default cursor to use the custom interactive blue dot */
        }

        /* Hero Wrapper */
        .hero-section {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        /* 
           Convex Glowing Dome (The Curvature):
           A giant circle positioned so its upper boundary curves up in the center 
           and sweeps down at the sides, framing the text from above.
        */
        .glowing-dome {
            position: absolute;
            top: 15%; /* Positioned above the text to create the framing curvature */
            left: 50%;
            transform: translateX(-50%);
            width: 155vw;
            height: 155vw;
            border-radius: 50%;
            background: radial-gradient(circle at center top, 
                        rgba(0, 82, 255, 0.45) 0%, 
                        rgba(0, 30, 120, 0.15) 30%, 
                        rgba(0, 0, 0, 0) 65%);
            pointer-events: none;
            z-index: -1;
        }

        /* Heading Layout */
        .heading-container {
            text-align: center;
            margin-bottom: 90px;
            z-index: 2;
        }

        .heading-container .sub-title {
            font-size: 3.8rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: -0.03em;
            line-height: 1.2;
        }

        .heading-container .main-title {
            font-size: 5.2rem;
            font-weight: 800;
            font-style: italic;
            color: #ffffff;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-top: -5px;
        }

        /* Interactive Blue Dot (Smooth Cursor) */
        .custom-cursor {
            width: 10px;
            height: 10px;
            background-color: #0052ff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 15px 5px rgba(0, 82, 255, 0.8);
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.1s ease;
        }

        /* Stats Grid Layout */
        .stats-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            z-index: 2;
            padding: 0 24px;
        }

        .stat-block {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-number {
            font-size: 4rem;
            font-weight: 800;
            font-style: italic;
            color: #ffffff;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.4;
            font-weight: 400;
            text-align: center;
        }

        /* Blue Vertical Dividers */
        .divider-line {
            width: 1px;
            height: 48px;
            background-color: #0052ff;
            opacity: 0.8;
            flex-shrink: 0;
        }

        /* Responsive Adaptations */
        @media (max-width: 968px) {
            body {
                cursor: auto;
            }
            .custom-cursor {
                display: none;
            }
            .heading-container .sub-title {
                font-size: 2.6rem;
            }
            .heading-container .main-title {
                font-size: 3.6rem;
            }
            .stats-row {
                flex-direction: column;
                gap: 40px;
            }
            .divider-line {
                width: 40px;
                height: 1px;
            }
            .glowing-dome {
                width: 100%;
                height: 350px;
                top: 50px;
            }
        }
    </style>
</head>
<body>

    <!-- Interactive Blue Dot -->
    <div class="custom-cursor" id="cursor"></div>

    <!-- Main Page Section -->
    <section class="hero-section">
        
        <!-- Corrected Dome Curvature Element -->
        <div class="glowing-dome"></div>

        <!-- Typography Block -->
        <div class="heading-container">
            <div class="sub-title">You Can</div>
            <div class="main-title">Count On Us</div>
        </div>

        <!-- Metrics Row -->
        <div class="stats-row">
            
            <!-- Item 1 -->
            <div class="stat-block">
                <div class="stat-number" data-target="9" data-suffix=" yrs">0 yrs</div>
                <div class="stat-label">In UI/UX &<br>Product Design</div>
            </div>

            <div class="divider-line"></div>

            <!-- Item 2 -->
            <div class="stat-block">
                <div class="stat-number" data-target="100" data-suffix="+">0+</div>
                <div class="stat-label">Projects<br>Delivered</div>
            </div>

            <div class="divider-line"></div>

            <!-- Item 3 -->
            <div class="stat-block">
                <div class="stat-number" data-target="7" data-suffix="+">0+</div>
                <div class="stat-label">Strong Enterprise<br>Collabs</div>
            </div>

            <div class="divider-line"></div>

            <!-- Item 4 -->
            <div class="stat-block">
                <div class="stat-number" data-target="98" data-suffix="%">0%</div>
                <div class="stat-label">Success<br>Rate</div>
            </div>

            <div class="divider-line"></div>

            <!-- Item 5 -->
            <div class="stat-block">
                <div class="stat-number" data-target="1" data-suffix=" Day">0 Day</div>
                <div class="stat-label">& Designer<br>is yours</div>
            </div>

        </div>
    </section>

    <!-- Interactive Functions -->
    <script>
        // 1. Mouse Follower Physics for the Blue Dot
        const cursor = document.getElementById('cursor');
        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursor.style.opacity = '1';
        });

        document.addEventListener('mouseleave', () => {
            cursor.style.opacity = '0';
        });

        function animateCursor() {
            // Apply linear interpolation for smooth trailing weight
            cursorX += (mouseX - cursorX) * 0.12;
            cursorY += (mouseY - cursorY) * 0.12;
            cursor.style.left = `${cursorX}px`;
            cursor.style.top = `${cursorY}px`;
            requestAnimationFrame(animateCursor);
        }
        requestAnimationFrame(animateCursor);

        // Hover expansions
        const hoverTargets = document.querySelectorAll('.stat-block, .heading-container');
        hoverTargets.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1.6)';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
            });
        });

        // 2. Linear Ease-Out Numeric Counters
        function initCounters() {
            const counters = document.querySelectorAll('.stat-number');
            const duration = 1600; // Animation window in ms

            counters.forEach(counter => {
                const target = parseInt(counter.getAttribute('data-target'), 10);
                const suffix = counter.getAttribute('data-suffix') || '';
                const startTime = performance.now();

                function run(currentTime) {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    // Decelerating calculation
                    const easedProgress = progress * (2 - progress);
                    
                    const value = Math.floor(easedProgress * target);
                    counter.textContent = value + suffix;

                    if (progress < 1) {
                        requestAnimationFrame(run);
                    } else {
                        counter.textContent = target + suffix;
                    }
                }

                requestAnimationFrame(run);
            });
        }

        window.addEventListener('DOMContentLoaded', initCounters);
    </script>
</body>
</html>
