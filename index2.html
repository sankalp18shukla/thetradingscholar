<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Market Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Ambient subtle grid overlay for depth */
        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Minimalist Trading Panel Overlay */
        .market-panel {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            z-index: 10;
            pointer-events: none;
            transition: border-color 0.3s ease;
        }

        .market-title {
            font-size: 11px;
            font-weight: 700;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .price-display {
            font-size: 32px;
            font-weight: 700;
            color: #1c1c1e;
            letter-spacing: -1px;
            font-feature-settings: "tnum" on; /* Prevents shifting numbers */
        }

        .price-change {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            font-feature-settings: "tnum" on;
        }

        .price-change.up {
            color: #00a651;
        }

        .price-change.down {
            color: #df222a;
        }

        /* Subtle animated dot in the UI card */
        .live-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #00a651;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }
    </style>
</head>
<body>

<div id="app-container">
    <div class="market-panel">
        <div class="market-title">
            <span class="live-indicator" id="live-dot"></span>Live Index Track
        </div>
        <div class="price-row">
            <span class="price-display" id="price-lbl">$10,000.00</span>
            <span class="price-change up" id="change-lbl">+0.00%</span>
        </div>
    </div>
    <canvas id="chartCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');
    const priceLbl = document.getElementById('price-lbl');
    const changeLbl = document.getElementById('change-lbl');
    const liveDot = document.getElementById('live-dot');

    // UI Configuration
    const rightMargin = 100; // Room for price indicators and scales
    const topMargin = 100;   // Safe zone from top
    const bottomMargin = 80; // Safe zone from bottom
    const dx = 16;           // Distance between points on the X axis

    // Colors
    const COLOR_UP_BASE = '#00a651';
    const COLOR_UP_GLOW1 = 'rgba(0, 166, 81, 0.45)';
    const COLOR_UP_GLOW2 = 'rgba(0, 166, 81, 0.15)';

    const COLOR_DOWN_BASE = '#df222a';
    const COLOR_DOWN_GLOW1 = 'rgba(223, 34, 42, 0.45)';
    const COLOR_DOWN_GLOW2 = 'rgba(223, 34, 42, 0.15)';

    const COLOR_GRID = 'rgba(0, 0, 0, 0.03)';
    const COLOR_TEXT = '#8e8e93';

    // Market Simulation State
    let initialPrice = 10450.00;
    let currentPrice = initialPrice;
    let targetPrice = initialPrice;
    let prices = [];         // Stores historical price ticks
    let offset = 0;          // Dynamic horizontal scroll progress
    let speed = 0.85;        // Horizontal scroll rate (pixels per frame)

    // Dynamic scale limits (smoothly transition to avoid sharp layout jumps)
    let minPriceSmooth = 10300;
    let maxPriceSmooth = 10600;

    // Tick/Trend generation controls
    let trendDuration = 0;
    let trendDirection = 0; // -1 (bearish), 1 (bullish), 0 (flat)

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);
        
        // Populate array initially to fill screen if empty
        const maxPoints = Math.ceil((window.innerWidth - rightMargin) / dx) + 5;
        if (prices.length === 0) {
            for (let i = 0; i < maxPoints; i++) {
                prices.push(generateNextPricePoint(prices[prices.length - 1] || initialPrice));
            }
            currentPrice = prices[prices.length - 1];
            targetPrice = currentPrice;
        }
    }

    // Algorithmic Price Generator (Geometric walk with random trend momentum)
    function generateNextPricePoint(basePrice) {
        if (trendDuration <= 0) {
            // Decide a new short-term momentum trend
            trendDirection = (Math.random() - 0.5) * 1.8; // range from roughly -0.9 to 0.9
            trendDuration = Math.floor(Math.random() * 80) + 40; // frames
        }
        trendDuration--;

        const volatility = 4.5;
        const change = (Math.random() - 0.5) * volatility + (trendDirection * 1.1);
        let next = basePrice + change;
        
        // Ensure price stays in a positive band
        if (next < 1000) next = 1000;
        return parseFloat(next.toFixed(2));
    }

    // Smoothly update live tick values to create realistic, micro-fluctuations
    function tickActivePrice() {
        if (Math.abs(currentPrice - targetPrice) < 0.05) {
            targetPrice = generateNextPricePoint(currentPrice);
        }
        // Lerp step for sub-frame micro fluctuations
        currentPrice += (targetPrice - currentPrice) * 0.15;
    }

    function formatCurrency(val) {
        return '$' + val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function draw() {
        const width = window.innerWidth;
        const height = window.innerHeight;

        // 1. Clear with clean white
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);

        // Advance simulation scrolling
        offset += speed;
        if (offset >= dx) {
            // Push active price to history, discard oldest point off-screen
            prices.push(parseFloat(currentPrice.toFixed(2)));
            prices.shift();
            offset -= dx;
        }

        // Always keep the absolute last index synchronized with the live tracking tick
        prices[prices.length - 1] = currentPrice;

        // 2. Dynamic auto-scaling bounds detection
        let minVal = Math.min(...prices);
        let maxVal = Math.max(...prices);
        const padding = (maxVal - minVal) * 0.15 || 10; // 15% padding top and bottom
        
        const targetMin = minVal - padding;
        const targetMax = maxVal + padding;

        // Smoothly interpolate coordinate bounds to avoid jarring camera pops
        minPriceSmooth += (targetMin - minPriceSmooth) * 0.05;
        maxPriceSmooth += (targetMax - maxPriceSmooth) * 0.05;

        // Price mapping function to vertical canvas coordinates
        function getScaleY(priceValue) {
            const chartHeight = height - topMargin - bottomMargin;
            const normalized = (priceValue - minPriceSmooth) / (maxPriceSmooth - minPriceSmooth);
            return height - bottomMargin - (normalized * chartHeight);
        }

        // 3. Render grid background layers
        const gridLinesCount = 5;
        ctx.font = '11px -apple-system, sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';

        for (let i = 0; i < gridLinesCount; i++) {
            const gridVal = minPriceSmooth + (i * (maxPriceSmooth - minPriceSmooth) / (gridLinesCount - 1));
            const y = getScaleY(gridVal);

            // Grid lines
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width - rightMargin, y);
            ctx.strokeStyle = COLOR_GRID;
            ctx.lineWidth = 1;
            ctx.stroke();

            // Axis price indicators
            ctx.fillStyle = COLOR_TEXT;
            ctx.fillText(formatCurrency(gridVal), width - 15, y);
        }

        // Vertical faint grid tracking lines moving with the scale
        const verticalGridInterval = dx * 8;
        const verticalGridOffset = offset % verticalGridInterval;
        ctx.beginPath();
        for (let x = width - rightMargin - verticalGridOffset; x > 0; x -= verticalGridInterval) {
            ctx.moveTo(x, topMargin);
            ctx.lineTo(x, height - bottomMargin);
        }
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.015)';
        ctx.stroke();

        // 4. Calculate coordinates of historical segments
        const coords = [];
        for (let i = 0; i < prices.length; i++) {
            const x = i * dx - offset;
            const y = getScaleY(prices[i]);
            coords.push({ x, y, price: prices[i] });
        }

        // Draw very subtle global background gradient shape underneath the line
        ctx.beginPath();
        ctx.moveTo(coords[0].x, height - bottomMargin);
        for (let i = 0; i < coords.length; i++) {
            ctx.lineTo(coords[i].x, coords[i].y);
        }
        ctx.lineTo(coords[coords.length - 1].x, height - bottomMargin);
        ctx.closePath();
        
        const areaGrad = ctx.createLinearGradient(0, topMargin, 0, height - bottomMargin);
        areaGrad.addColorStop(0, 'rgba(0, 0, 0, 0.025)');
        areaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = areaGrad;
        ctx.fill();

        // 5. Draw segments with layered glowing outlines (UP = Green, DOWN = Red)
        for (let i = 1; i < coords.length; i++) {
            const p1 = coords[i - 1];
            const p2 = coords[i];

            // Up or down trend determining color
            const isUp = p2.price >= p1.price;
            const colorBase = isUp ? COLOR_UP_BASE : COLOR_DOWN_BASE;
            const colorGlow1 = isUp ? COLOR_UP_GLOW1 : COLOR_DOWN_GLOW1;
            const colorGlow2 = isUp ? COLOR_UP_GLOW2 : COLOR_DOWN_GLOW2;

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Glow Pass 1 (Broad blur)
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = colorGlow2;
            ctx.lineWidth = 15;
            ctx.stroke();

            // Glow Pass 2 (Focused glow)
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = colorGlow1;
            ctx.lineWidth = 7;
            ctx.stroke();

            // Core Line Pass
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = colorBase;
            ctx.lineWidth = 2.5;
            ctx.stroke();
        }

        // 6. Draw current price active tracker horizontal bar
        const latestPoint = coords[coords.length - 1];
        const isUpNow = currentPrice >= prices[prices.length - 2];
        const activeColor = isUpNow ? COLOR_UP_BASE : COLOR_DOWN_BASE;

        // Horizontal dashed tracking pointer
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(latestPoint.x, latestPoint.y);
        ctx.lineTo(width - rightMargin, latestPoint.y);
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.setLineDash([]); // Reset dashed state

        // Dynamic pulsing dot at lead price segment
        const pulseScale = (Date.now() % 1200) / 1200; // repeating 0.0 -> 1.0 ramp
        ctx.beginPath();
        ctx.arc(latestPoint.x, latestPoint.y, 4 + (pulseScale * 8), 0, Math.PI * 2);
        ctx.fillStyle = isUpNow ? 'rgba(0, 166, 81, ' + (0.35 * (1 - pulseScale)) + ')' : 'rgba(223, 34, 42, ' + (0.35 * (1 - pulseScale)) + ')';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(latestPoint.x, latestPoint.y, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = activeColor;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.fill();
        ctx.stroke();

        // Active right margin capsule indicator
        const capsuleY = latestPoint.y;
        ctx.fillStyle = activeColor;
        
        // Custom rounded capsule path
        const capH = 22;
        const capW = 75;
        const capX = width - rightMargin + 10;
        
        ctx.beginPath();
        ctx.roundRect(capX, capsuleY - (capH / 2), capW, capH, 5);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10.5px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(currentPrice.toFixed(1), capX + (capW / 2), capsuleY);

        // 7. Update HTML UI Card
        priceLbl.innerText = formatCurrency(currentPrice);
        
        // Percent dynamic delta from initial starting session price
        const rawChange = currentPrice - initialPrice;
        const percentChange = (rawChange / initialPrice) * 100;
        const changeSign = percentChange >= 0 ? '+' : '';
        
        changeLbl.innerText = `${changeSign}${percentChange.toFixed(2)}%`;
        
        if (percentChange >= 0) {
            changeLbl.className = "price-change up";
            liveDot.style.backgroundColor = COLOR_UP_BASE;
        } else {
            changeLbl.className = "price-change down";
            liveDot.style.backgroundColor = COLOR_DOWN_BASE;
        }

        tickActivePrice();
        requestAnimationFrame(draw);
    }

    // Set up canvas sizing listeners and start main engine loop
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    requestAnimationFrame(draw);
</script>

</body>
</html>
